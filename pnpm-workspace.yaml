minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@iconify-json/carbon@1.2.29'
  - tsdown@0.23.2

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*
  - docs

allowBuilds:
  esbuild: true

catalogs:
  build:
    oxfmt: ^0.74.0
    oxlint: ^1.89.0
    oxlint-tsgolint: ^7.0.2005
    tsdown: ^0.23.2
    tsx: ^4.23.15
    typescript: ^7.0.2
  cli:
    ansis: ^4.4.0
    cac: ^7.1.0
  docs:
    '@iconify-json/carbon': ^1.2.29
    '@unocss/reset': ^66.11.0
    unocss: ^66.11.0
    vitepress: ^1.6.4
    vue: ^3.5.44
  runtime:
    '@decimalturn/toml-patch': ^3.3.1
    diff: ^9.0.0
    jsonc-parser: ^3.3.1
    pathe: ^2.0.3
    tinyexec: ^1.3.1
    valibot: ^1.5.0
  testing:
    '@vitest/coverage-v8': ^5.0.5
    vitest: ^5.0.5
  tooling:
    '@changesets/cli': ^3.0.3
    '@commitlint/cli': ^21.2.4
    '@commitlint/config-conventional': ^21.2.4
    '@commitlint/types': ^21.2.3
    husky: ^9.1.7
    lint-staged: ^17.6.0
  types:
    '@types/node': ^26.6.5
